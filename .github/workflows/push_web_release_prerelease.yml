name: Build & Publish to itch.io

on:
  push:
    branches:
      - "**"   # build on all branches

env:
  ITCH_PROJECT: chugget/testing

jobs:
  # ───────────────────────────────
  #  Native build (TEMPORARILY DISABLED)
  # ───────────────────────────────
  build-native:
    if: false          # <── DISABLE native job cleanly
    name: Build Native (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              build-essential cmake \
              libx11-dev libasound2-dev libudev-dev \
              libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
              libgl1-mesa-dev \
              libgl-dev \
              mesa-common-dev

      - name: Configure CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: cmake --build build --config Release

      - name: Package native build
        run: |
          mkdir -p dist/native/linux
          cp build/* dist/native/linux/ || true
          cp -R assets dist/native/linux/

      - name: Upload native build (v4)
        uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: dist/native/linux
          compression-level: 0


  # ───────────────────────────────
  #  Web build (ALWAYS RUNS)
  #  PARITY: Matches `just deploy-web` exactly
  # ───────────────────────────────
  build-web:
    name: Build Web (Emscripten WASM)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.message, '[build]') ||
      contains(github.event.head_commit.message, '[web]') ||
      contains(github.event.head_commit.message, '#build')

    env:
      # Match Justfile project_name and web_build_dir
      PROJECT_NAME: raylib-cpp-cmake-template
      WEB_BUILD_DIR: build-web

    steps:
      - uses: actions/checkout@v3

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.67
          actions-cache-folder: "emsdk-cache"

      - name: Clean FetchContent deps
        run: rm -rf ${{ env.WEB_BUILD_DIR }}/_deps

      # PARITY: copy-web-assets (Justfile:222-238)
      # Must run BEFORE cmake configure so assets are available
      - name: Copy assets to build directory (with Lua stripping)
        run: |
          python3 scripts/copy_assets.py assets ${{ env.WEB_BUILD_DIR }}/assets --strip-lua

      # PARITY: build-web configure step (Justfile:241-272)
      # Match Justfile linker flags but use Release build for CI (faster linking)
      # NOTE: Removed -gsource-map for CI (causes very slow linking)
      - name: Configure CMake (Web)
        run: |
          LINK_FLAGS="-sUSE_GLFW=3 -sFULL_ES2=1 -sFULL_ES3=1 -sMIN_WEBGL_VERSION=2 -sMAX_WEBGL_VERSION=2 -Oz -sALLOW_MEMORY_GROWTH=1 -sASSERTIONS=1 -sDISABLE_EXCEPTION_CATCHING=0 -DNDEBUG -sWASM=1 -sSIDE_MODULE=0 -sEXIT_RUNTIME=1 -sERROR_ON_UNDEFINED_SYMBOLS=0 -sEXPORTED_RUNTIME_METHODS=HEAPF32,HEAPF64,HEAP8,HEAP16,HEAP32,HEAPU8,HEAPU16,HEAPU32,stringToUTF8OnStack,UTF8ToString,stringToUTF8,lengthBytesUTF8"
          
          emcmake cmake -S . -B ${{ env.WEB_BUILD_DIR }} \
            -DPLATFORM=Web \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="$LINK_FLAGS" \
            -DCMAKE_EXECUTABLE_SUFFIX=.html \
            -DENABLE_LTO=OFF

      # PARITY: build-web build step (Justfile:274-275)
      - name: Build Web
        run: cmake --build ${{ env.WEB_BUILD_DIR }}

      # PARITY: rename-to-index (Justfile:280-285)
      - name: Rename to index.html
        run: |
          cp ${{ env.WEB_BUILD_DIR }}/${{ env.PROJECT_NAME }}.html ${{ env.WEB_BUILD_DIR }}/index.html

      # PARITY: inject-web-snippet (Justfile:288-299)
      # Injects pako gzip decompression into index.html
      - name: Inject gzip decompression snippet
        run: |
          cmake \
            -DHTML_PATH="${{ env.WEB_BUILD_DIR }}/index.html" \
            -DSNIPPET_PATH="cmake/inject_snippet.html" \
            -P cmake/inject_snippet.cmake

      # PARITY: gzip-web-assets (Justfile:302-326)
      - name: Gzip WASM and DATA files
        run: |
          WASM_FILE="${{ env.WEB_BUILD_DIR }}/${{ env.PROJECT_NAME }}.wasm"
          DATA_FILE="${{ env.WEB_BUILD_DIR }}/${{ env.PROJECT_NAME }}.data"
          
          # Keep originals as backup
          cp "$WASM_FILE" "$WASM_FILE.orig"
          cp "$DATA_FILE" "$DATA_FILE.orig"
          
          # Gzip with -k (keep original) and -f (force)
          gzip -kf "$WASM_FILE"
          gzip -kf "$DATA_FILE"
          
          # Show size reduction
          echo "=== Compression Results ==="
          ls -lh "$WASM_FILE.orig" "$WASM_FILE.gz"
          ls -lh "$DATA_FILE.orig" "$DATA_FILE.gz"

      # PARITY: zip-web-build (Justfile:329-347)
      # Package with gzipped files (not originals)
      - name: Package Web build
        run: |
          mkdir -p dist
          cd ${{ env.WEB_BUILD_DIR }}
          
          # Create zip with gzipped assets (matches Justfile exactly)
          zip -r ../dist/web-build.zip \
            index.html \
            ${{ env.PROJECT_NAME }}.wasm.gz \
            ${{ env.PROJECT_NAME }}.data.gz \
            ${{ env.PROJECT_NAME }}.js \
            assets
          
          cd ..
          echo "=== Distribution Package ==="
          ls -lh dist/web-build.zip

      - name: Upload web build (v4)
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist/web-build.zip
          compression-level: 0


  # ───────────────────────────────
  #  Publish JOB (only depends on WEB now)
  # ───────────────────────────────
  publish:
    name: Publish to itch.io
    needs: [ build-web ]         # <── removed native dependency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Native disabled → skip download
      # - name: Download native build
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: native-linux
      #     path: native

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Setup Butler
        uses: jdno/setup-butler@v1
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Determine itch channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "channel=web" >> $GITHUB_OUTPUT
          else
            echo "channel=web-dev" >> $GITHUB_OUTPUT
          fi

      - name: Version string
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=build-${GITHUB_SHA}" >> $GITHUB_OUTPUT
          fi

      # Native publish disabled
      # - name: Publish native build
      #   run: |
      #     butler push native \
      #       ${{ env.ITCH_PROJECT }}:linux \
      #       --userversion ${{ steps.version.outputs.version }}

      - name: Publish web build
        run: |
          butler push web/web-build.zip \
            ${{ env.ITCH_PROJECT }}:${{ steps.channel.outputs.channel }} \
            --userversion ${{ steps.version.outputs.version }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
